<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Huddle">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Agent Huddle · Sign in</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--text:#1f1e1c;--muted:#6b6862;--line:#e2dfd8;--accent:#2f6fde;--ink:#fff;--danger:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#191918;--panel:#212120;--text:#ecebe8;--muted:#9b988f;--line:#33322f;--accent:#6ea0ff;--ink:#0d1220;--danger:#fb923c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:340px}
h1{font-size:20px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.dots{display:flex;gap:5px;margin-bottom:14px}.dots span{width:9px;height:9px;border-radius:50%}
input{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
input:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;border:0;border-radius:9px;padding:10px;background:var(--accent);color:var(--ink);cursor:pointer}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<form id="f">
  <img src="/icons/icon-192.png" alt="" width="56" height="56" style="border-radius:14px;margin-bottom:12px;display:block">
  <div class="dots" style="display:none"><span style="background:#d97757"></span><span style="background:#10a37f"></span><span style="background:#4285f4"></span><span style="background:#8b8b8b"></span><span style="background:#c084fc"></span></div>
  <h1>Agent Huddle</h1>
  <p>One chat for all your AI agents.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button>Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.href = '/'; else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || 'Sign-in failed';
};
</script>
</body>
</html>
